name: Build Linux Flatpak

on:
  push:
    branches: [main]
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
      - "Makefile"
  pull_request:
    branches: [main]
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
      - "Makefile"
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ColorModel Unit Tests
        run: |
          make test-linux

  flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest
    needs: test
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ContrastChecker.flatpak
          manifest-path: linux/io.github.svinkle.ContrastChecker.yml
          run-tests: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContrastChecker-Linux-Flatpak
          path: ContrastChecker.flatpak
